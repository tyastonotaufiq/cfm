# App icons for every platform, made from the images in assets/icon/
# (drawn by tool/make_icon.py). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  adaptive_icon_background: "#EDEBE3"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

  ios: true
  remove_alpha_ios: true

  macos:
    generate: true
    image_path: "assets/icon/icon_macos.png"

  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#EDEBE3"
    theme_color: "#EDEBE3"
